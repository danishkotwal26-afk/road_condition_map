<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Road Condition Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="sidebar">
    <div id="sidebar-header">
      <span id="logo-icon">🛣️</span>
      <div>
        <h1>RoadWatch</h1>
        <p id="subtitle">Live Condition Map</p>
      </div>
    </div>

    <div id="stats-bar">
      <div class="stat" id="stat-good">
        <span class="stat-dot good"></span>
        <span class="stat-label">Good</span>
        <span class="stat-count" id="count-good">0</span>
      </div>
      <div class="stat" id="stat-medium">
        <span class="stat-dot medium"></span>
        <span class="stat-label">Fair</span>
        <span class="stat-count" id="count-medium">0</span>
      </div>
      <div class="stat" id="stat-bad">
        <span class="stat-dot bad"></span>
        <span class="stat-label">Bad</span>
        <span class="stat-count" id="count-bad">0</span>
      </div>
    </div>

    <!-- ADD ROAD BUTTON -->
    <div id="add-road-section">
      <button id="draw-btn">
        <span id="draw-btn-icon">✏️</span> Add Road Segment
      </button>
      <button id="export-btn" title="Download updated roads.json">
        📥 Export JSON
      </button>
    </div>

    <div id="filter-section">
      <p class="section-label">FILTER BY CONDITION</p>
      <div id="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="good">Good</button>
        <button class="filter-btn" data-filter="medium">Fair</button>
        <button class="filter-btn" data-filter="bad">Bad</button>
      </div>
    </div>

    <div id="layer-section">
      <p class="section-label">MAP STYLE</p>
      <div id="layer-buttons">
        <button class="layer-btn active" data-layer="street">Street</button>
        <button class="layer-btn" data-layer="satellite">Satellite</button>
        <button class="layer-btn" data-layer="dark">Dark</button>
      </div>
    </div>

    <div id="info-panel">
      <p class="section-label">SELECTED ROAD</p>
      <div id="road-detail">
        <p id="no-selection">Click a road segment to see details.</p>
      </div>
    </div>

    <div id="sidebar-footer">
      <span id="refresh-status">⟳ Auto-refresh 30s</span>
      <button id="refresh-btn" title="Refresh now">↻</button>
    </div>
  </div>

  <div id="map-container">
    <div id="map"></div>

    <!-- DRAW TOOLBAR (shown only in draw mode) -->
    <div id="draw-toolbar" class="hidden">
      <span id="draw-toolbar-title">📍 Drawing segment</span>
      <div id="cond-pills">
        <button class="cond-pill active" data-cond="good">Good</button>
        <button class="cond-pill" data-cond="medium">Fair</button>
        <button class="cond-pill" data-cond="bad">Bad</button>
      </div>
      <div id="draw-actions">
        <button id="undo-point-btn" title="Undo last point">↩ Undo</button>
        <button id="save-segment-btn">✅ Save</button>
        <button id="cancel-draw-btn">✕ Cancel</button>
      </div>
    </div>

    <div id="map-overlay-legend">
      <span class="legend-item"><span class="legend-dot good"></span> Good</span>
      <span class="legend-item"><span class="legend-dot medium"></span> Fair</span>
      <span class="legend-item"><span class="legend-dot bad"></span> Bad</span>
    </div>

    <div id="loading-indicator" class="hidden">Loading…</div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="hidden"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
